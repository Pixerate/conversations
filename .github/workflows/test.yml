name: Test & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Type Check, Unit Tests & Build
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check for Changesets
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changeset') && !contains(github.event.pull_request.title, '[skip changeset]') && github.actor != 'dependabot[bot]'
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          if [ "$CHANGESETS" -eq "0" ]; then
            echo "::error title=Missing Changeset::No changeset found in .changeset/. Please run 'npm run changeset' and include the generated markdown file in your PR."
            echo "If this PR should be exempt from versioning, add the 'skip-changeset' label."
            exit 1
          else
            echo "Pending changeset found: $CHANGESETS"
          fi


      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}

      - name: Install Dependencies
        run: npm ci

      - name: Svelte & Type Check (sv check)
        run: npm run check

      - name: Run Unit Tests
        run: npm run test

      - name: Build Package
        run: npm run build

